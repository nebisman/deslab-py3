[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deslab"
version = "0.1.0"
description = "DESlab: analysis and synthesis of discrete event systems modeled as automata (Python 3 version)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Leonardo Bermeo", email = "lbermeoc@unal.edu.co" },
    { name = "Joao Carlos Basilio", email = "basilio@poli.ufrj.br" },
]
dependencies = [
    "networkx>=2.6",
    "graphviz>=0.20",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["deslab*"]

[tool.setuptools.package-data]
"deslab.graphics" = ["texfiles/*.tex"]
